<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E211A">
<title>CoachFolio GK Pro</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0E211A;
  --surface: #142E24;
  --surface-2: #1A3A2E;
  --line: #2A4A3E;
  --chalk: #F3EFE6;
  --muted: #8FA79B;
  --gold: #D9A441;
  --gold-dim: rgba(217, 164, 65, 0.15);
  --red: #C8493F;
  --green: #4CAF50;
  --yellow: #F9C74F;
  --blue: #4A90D9;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--chalk);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 70px;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; }

/* NAVBAR */
#navbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.nav-btn {
  flex: 1; background: none; border: none; color: var(--muted);
  font-size: 10px; padding: 6px 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color 0.2s;
}
.nav-btn.active { color: var(--gold); }
.nav-btn svg { width: 22px; height: 22px; }

/* TOPBAR */
.topbar {
  text-align: center; padding: 20px 16px 16px;
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
}
.topbar h1 {
  font-size: 26px; letter-spacing: 0.08em; color: var(--chalk);
  margin: 12px 0 4px 0; font-weight: 800;
}
.topbar .subtitle {
  font-size: 11px; color: var(--gold); letter-spacing: 0.15em;
  text-transform: uppercase; font-weight: 600;
}
.topbar .author {
  font-size: 10px; color: var(--muted); margin-top: 4px;
  font-style: italic;
}

/* CARDS */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin: 10px 16px;
}
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.card-title {
  font-size: 13px; color: var(--gold); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
}

/* BUTTONS */
.btn {
  padding: 10px 16px; border-radius: 8px; border: none;
  font-weight: 700; font-size: 13px; cursor: pointer;
  transition: opacity 0.2s;
}
.btn:active { opacity: 0.7; }
.btn-gold { background: var(--gold); color: #000; }
.btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
.btn-danger { background: var(--red); color: #fff; }

/* SEGMENTED CONTROL */
.seg {
  display: flex; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; margin: 10px 16px;
}
.seg-btn {
  flex: 1; padding: 10px; text-align: center;
  font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all 0.2s;
}
.seg-btn.active { background: var(--gold-dim); color: var(--gold); }

/* FORMS */
.field { margin-bottom: 10px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--chalk); border-radius: 8px; font-size: 13px;
}
.field label {
  display: block; font-size: 10px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 4px; font-weight: 700;
}

/* TOAST */
#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--surface-2); color: var(--chalk);
  padding: 10px 20px; border-radius: 8px; font-size: 12px;
  border: 1px solid var(--gold); z-index: 200;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; }

/* EMPTY STATE */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--muted); font-size: 13px; line-height: 1.6;
}

/* FOOTER */
.footer {
  text-align: center; padding: 20px 16px 40px;
  font-size: 10px; color: var(--muted);
}
.footer a { color: var(--gold); text-decoration: none; }

/* MODAL */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 20px; width: 100%; max-width: 400px;
}

/* ADD ROW */
.add-row {
  display: flex; gap: 8px; margin: 10px 16px;
}
.add-row input {
  flex: 1; padding: 10px; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--chalk);
  border-radius: 8px; font-size: 13px;
}
.add-row button {
  width: 40px; background: var(--gold); color: #000;
  border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
  cursor: pointer;
}

/* PRINT AREA */
@media print {
  body * { 
    visibility: hidden; 
  }
  #print-area, #print-area * { 
    visibility: visible; 
  }
  #print-area {
    display: block !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
  }
  @page {
    margin: 1cm;
    size: A4;
  }
}
</style>
</head>

// SVG da Luva Premium (Identidade CoachFolio GK Pro - Dedos Unidos e Polegar Afinado)

    <path d="M 65 55 L 74 61 L 71 72 L 59 72 L 56 61 Z" fill="var(--bg)" stroke="var(--bg)" stroke-width="1.5" stroke-linejoin="round"/>

}

// Navegação
let currentView = 'home';
   Object.defineProperty(window, 'currentTab', { get: () => currentView, set: v => { currentView = v; }, configurable: true });
function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    const views = ['home', 'planeamento', 'jogo', 'tatica', 'equipa'];
    btn.classList.toggle('active', views[i] === view);
  });
  render();
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// UID
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

// Helper: Escape HTML
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

// Compatibilidade: Devolve os GRs como "Jogadores Elegíveis" para o Quadro Tático
window.eligiblePlayers = function() {
  return (state.gkRoster || []).filter(p => p.active !== false);
};

// Compatibilidade de cor: Devolve preto ou branco consoante o contraste do fundo
window.getContrastColor = function(hex) {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6) return '#000000';
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#000000' : '#FFFFFF';
};

// Render principal CORRETO E LIMPO
function render() {
  const app = document.getElementById('app');
  const nav = document.getElementById('navbar');
  
  if (!state.isActivated) {
    nav.style.display = 'none';
    app.innerHTML = renderActivationScreen();
    return;
  }
  
  nav.style.display = 'flex';
  
  switch(currentView) {
    case 'home':
      // Chama a função renderHome() definida no vistas.js ou equipa.js
      // Garante que tens lá a versão com os 4 módulos e o ícone ⚙️
      app.innerHTML = (typeof renderHome === 'function') 
        ? renderHome() 
        : '<div class="empty">🏠 Página Inicial não encontrada.</div>';
      break;
      
    case 'planeamento': 
      app.innerHTML = (typeof window.renderPlaneamento === 'function') 
        ? window.renderPlaneamento() 
        : '<div class="topbar"><h1 style="font-size:18px;">PLANEAMENTO</h1></div><div class="empty">Módulo em desenvolvimento...<br><br>Microciclo, Mesociclo & Treinos</div>';
      break;
      
    case 'jogo': 
      app.innerHTML = (typeof window.renderJogo === 'function') 
        ? window.renderJogo() 
        : '<div class="topbar"><h1 style="font-size:18px;">DIA DE JOGO</h1></div><div class="empty">Módulo em desenvolvimento...</div>';
      break;
      
    case 'tatica': 
      app.innerHTML = (typeof window.renderTatica === 'function') 
        ? window.renderTatica() 
        : '<div class="empty">⚠️ Erro: Módulo Tática não carregado.</div>';
      break;
      
    case 'equipa': 
      app.innerHTML = (typeof window.renderEquipa === 'function') 
        ? window.renderEquipa() 
        : '<div class="topbar"><h1 style="font-size:18px;">EQUIPA</h1></div><div class="empty">🚧 Módulo em desenvolvimento...</div>';
      break;
      
    default: 
      currentView = 'home';
      render();
  }
}

          <label style="display:block; font-size:10px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; font-weight:bold;">Chave de Ativação</label>
          <input type="text" id="act-key" placeholder="Ex: A4F9B2" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--chalk); font-size:14px; box-sizing:border-box; text-transform:uppercase;">

        <button style="width:100%; padding:12px; background:var(--gold); color:#000; border:none; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;" onclick="activateApp()">Desbloquear</button>

function renderHome() {
  return `
    <div class="topbar" style="position:relative; z-index: 10;">

      <p style="margin-top:8px;">Desenvolvido por: <a href="https://instagram.com/coachfolio.app" target="_blank">@coachfolio.app</a></p>
      <p style="margin-top:8px;">© 2026 CoachFolio. Todos os direitos reservados.</p>
    </div>
  `;
}

// Inicialização
window.addEventListener('DOMContentLoaded', () => {
  if (typeof loadState === 'function') {
    loadState().then(() => render()).catch(() => render());
  } else {
    render();
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(registration => {
        console.log('Service Worker registado com sucesso.');

        // Verifica se há uma atualização a aguardar
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            // Se instalou uma versão nova e já existia uma antiga, avisa o utilizador!
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              mostrarToastAtualizacao(newWorker);
            }
          });
        });
      }).catch(error => {
        console.log('Falha ao registar o Service Worker:', error);
      });

      // Recarrega a página automaticamente assim que a nova versão assumir o controlo
      let refreshing;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }

  // Função que desenha o Toast de Atualização
  function mostrarToastAtualizacao(newWorker) {
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--gold); color: var(--chalk);
      padding: 16px; border-radius: 12px; font-size: 14px; font-weight: bold;
      z-index: 10000; box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: flex;
      flex-direction: column; gap: 10px; align-items: center; text-align: center; 
      width: 90%; max-width: 320px; animation: slideUp 0.4s ease-out;
    `;
    toast.innerHTML = `
      <div style="font-size:16px;">🚀 Nova versão disponível!</div>
      <div style="font-size:11px; color:var(--muted); font-weight:normal;">
        Foram adicionadas melhorias à aplicação.
      </div>
      <button id="btn-atualizar-app" style="background: var(--gold); color: #0E211A; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size:13px; cursor: pointer; width: 100%; margin-top:4px;">
        Atualizar Agora
      </button>
    `;
    document.body.appendChild(toast);

    // Quando o botão é clicado, avisa o sw.js para atualizar e fechar
    document.getElementById('btn-atualizar-app').addEventListener('click', () => {
      document.getElementById('btn-atualizar-app').innerHTML = 'A atualizar... ⏳';
      newWorker.postMessage('SKIP_WAITING');
    });
  }
</script>
