<svg width="512" height="512" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Hexágono de Fundo -->
    <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="#E5E7EB" stroke="#D9A441" stroke-width="3" stroke-linejoin="round" />

    <!-- Luva Dourada -->
    <g fill="#D9A441">
        <!-- Dedos -->
        <rect x="30" y="35" width="7" height="25" rx="3.5" />
        <rect x="39" y="28" width="7" height="32" rx="3.5" />
        <rect x="48" y="32" width="7" height="28" rx="3.5" />
        <rect x="57" y="38" width="7" height="22" rx="3.5" />
        <!-- Palma -->
        <rect x="30" y="55" width="34" height="25" rx="2" />
        <!-- Polegar -->
        <path d="M 32 55 L 20 62 C 18 64 18 68 22 70 L 32 68 Z" />
        <!-- Pulso -->
        <rect x="32" y="82" width="30" height="15" rx="1.5" />
    </g>
    
    <!-- Linhas Brancas no Pulso -->
    <line x1="32" y1="87" x2="62" y2="87" stroke="#E5E7EB" stroke-width="2" />
    <line x1="32" y1="92" x2="62" y2="92" stroke="#E5E7EB" stroke-width="2" />

    <!-- Bola -->
    <circle cx="75" cy="75" r="22" fill="#0E211A" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- Detalhes da Bola (Pentágono e Linhas) -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
        <!-- Pentágono Central -->
        <polygon points="75,66 84,72 80,81 70,81 66,72" fill="#FFFFFF" stroke-linejoin="round" />
        <!-- Costuras -->
        <line x1="75" y1="66" x2="75" y2="53" />
        <line x1="84" y1="72" x2="95" y2="68" />
        <line x1="80" y1="81" x2="89" y2="92" />
        <line x1="70" y1="81" x2="61" y2="92" />
        <line x1="66" y1="72" x2="55" y2="68" />
    </g>
</svg>